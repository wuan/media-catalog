<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ month_label }} · Media catalog</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body{% if location_preview %} data-location-preview="true"{% endif %}>
  <header class="site-header">
    <a class="brand" href="/">Media catalog</a>
    <nav><a href="/search.html">Search</a></nav>
  </header>
  <main>{% let grid_class = "grid" %}
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Home</a> <span aria-hidden="true">/</span>
      <a href="{{ year_url }}">{{ year }}</a> <span aria-hidden="true">/</span>
      <span>{{ month_label }}</span>
    </nav>
    {% include "month-nav.html" %}
    <h1>{{ month_label }}</h1>
    <p class="total">{{ item_count }} items</p>
    {% include "tiles.html" %}
    {% include "month-nav.html" %}
  </main>
  <footer><p>Generated by media-catalog.</p></footer>
  <script src="/assets/viewer.js" defer></script>
</body>
</html>
