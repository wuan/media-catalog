<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ month_label }} · Media catalog</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Media catalog</a>
    <nav><a href="/search.html">Search</a></nav>
  </header>
  <main>
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Home</a> <span aria-hidden="true">/</span>
      <a href="{{ year_url }}">{{ year }}</a> <span aria-hidden="true">/</span>
      <span>{{ month_label }}</span>
    </nav>
    <h1>{{ month_label }}</h1>
    <p class="total">{{ item_count }} items</p>
    <div class="grid">
      {% for item in items %}
      <figure class="tile">
        <a class="tile-link" href="{{ item.media_url }}">
          {% if item.thumb_available %}
          <img src="{{ item.thumb_url }}" alt="{{ item.alt }}" loading="lazy" decoding="async">
          {% else %}
          <span class="placeholder" role="img" aria-label="{{ item.alt }}">No preview</span>
          {% endif %}
          {% if item.is_video %}
          <span class="badge video">Video{% if item.duration_label != "" %} · {{ item.duration_label }}{% endif %}</span>
          {% endif %}
          <figcaption>
            <span class="name">{{ item.name }}</span>
            <time>{{ item.captured_label }}</time>
          </figcaption>
        </a>
      </figure>
      {% endfor %}
    </div>
  </main>
  <footer><p>Generated by media-catalog.</p></footer>
</body>
</html>
