<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Search · Media catalog</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Media catalog</a>
    <nav><a href="/">Browse</a></nav>
  </header>
  <main>
    <h1>Search</h1>
    <noscript>
      <p class="notice">JavaScript is required for filtering. You can still
        <a href="/">browse the catalog by year</a>.</p>
    </noscript>
    <form id="filters" class="filters" autocomplete="off">
      <label>Text
        <input id="q" name="q" type="search" placeholder="Filename or date">
      </label>
      <label>Type
        <select id="kind" name="kind">
          <option value="">All types</option>
          <option value="image">Photos</option>
          <option value="video">Videos</option>
        </select>
      </label>
      <label>Year
        <select id="year" name="year"><option value="">All years</option></select>
      </label>
      <label>Month
        <select id="month" name="month"><option value="">All months</option></select>
      </label>
    </form>
    <p id="status" class="status" role="status">Loading catalog…</p>
    <div id="results" class="grid"></div>
    <p class="browse"><a href="/">Browse years</a> · <a href="/search.html">Reset filters</a></p>
  </main>
  <footer><p>Generated by media-catalog.</p></footer>
  <script src="/assets/search.js" defer></script>
</body>
</html>
