<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Events · Media catalog</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Media catalog</a>
    <nav><a href="/search.html">Search</a></nav>
  </header>
  <main>
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Home</a> <span aria-hidden="true">/</span> <span>Events</span>
    </nav>
    <h1>Events</h1>
    {% if events.is_empty() %}
    <p class="empty">No events configured.</p>
    {% else %}
    <ul class="event-list">
      {% for event in events %}
      <li>
        <a href="{{ event.url }}">
          <span class="event-title">{{ event.title }}</span>
          <span class="range">{{ event.range }}</span>
          <span class="count">{{ event.count }} items</span>
        </a>
      </li>
      {% endfor %}
    </ul>
    {% endif %}
  </main>
  <footer><p>Generated by media-catalog.</p></footer>
</body>
</html>
