<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ year }} · Media catalog</title>
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Media catalog</a>
    <nav><a href="/search.html">Search</a></nav>
  </header>
  <main>
    <nav class="breadcrumbs" aria-label="Breadcrumb">
      <a href="/">Home</a> <span aria-hidden="true">/</span> <span>{{ year }}</span>
    </nav>
    <h1>{{ year }}</h1>
    <p class="total">{{ total_items }} items</p>
    {% if months.is_empty() %}
    <p class="empty">No media found for this year.</p>
    {% else %}
    <ul class="month-list">
      {% for month in months %}
      <li>
        <a href="{{ month.url }}">
          <span class="month">{{ month.month }}</span>
          <span class="count">{{ month.count }} items</span>
        </a>
      </li>
      {% endfor %}
    </ul>
    {% endif %}
  </main>
  <footer><p>Generated by media-catalog.</p></footer>
</body>
</html>
