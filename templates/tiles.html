<div class="grid">
  {% for item in items %}
  <figure class="tile">
    <a class="tile-link" href="{{ item.media_url }}"
      data-item-path="{{ item.rel_path }}"
      data-kind="{{ item.kind }}"
      data-captured="{{ item.captured_label }}"
      {% if let Some(size) = item.size %}data-size="{{ size }}"{% endif %}
      {% if item.thumb_available %}data-thumb-url="{{ item.thumb_url }}"{% endif %}
      {% if let Some(width) = item.width %}data-width="{{ width }}"{% endif %}
      {% if let Some(height) = item.height %}data-height="{{ height }}"{% endif %}
      {%- if let Some(f_number) = item.f_number %} data-f-number="{{ f_number }}"{%- endif %}
      {%- if let Some(exposure) = item.exposure %} data-exposure="{{ exposure }}"{%- endif %}
      {%- if let Some(iso) = item.iso %} data-iso="{{ iso }}"{%- endif %}
      {%- if let Some(focal) = item.focal_length_mm %} data-focal="{{ focal }}"{%- endif %}
      {%- if let Some(latitude) = item.latitude %} data-lat="{{ latitude }}"{%- endif %}
      {%- if let Some(longitude) = item.longitude %} data-lon="{{ longitude }}"{%- endif %}>
      {% if item.thumb_available %}
      <img src="{{ item.thumb_url }}" alt="{{ item.alt }}" loading="lazy" decoding="async">
      {% else %}
      <span class="placeholder" role="img" aria-label="{{ item.alt }}">No preview</span>
      {% endif %}
      {% if item.is_video %}
      <span class="badge video">Video{% if item.duration_label != "" %} · {{ item.duration_label }}{% endif %}</span>
      {% endif %}
      <figcaption><time>{{ item.caption_time }}</time>{% if item.model != "" %}<span class="model">{{ item.model }}</span>{% endif %}</figcaption>
    </a>
  </figure>
  {% endfor %}
</div>
