<div class="grid">
  {% for item in items %}
  <figure class="tile">
    <a class="tile-link" href="{{ item.media_url }}"
      data-item-path="{{ item.rel_path }}"
      data-kind="{{ item.kind }}"
      data-captured="{{ item.captured_label }}"
      {% if item.thumb_available %}data-thumb-url="{{ item.thumb_url }}"{% endif %}
      {% if let Some(width) = item.width %}data-width="{{ width }}"{% endif %}
      {% if let Some(height) = item.height %}data-height="{{ height }}"{% endif %}>
      {% if item.thumb_available %}
      <img src="{{ item.thumb_url }}" alt="{{ item.alt }}" loading="lazy" decoding="async">
      {% else %}
      <span class="placeholder" role="img" aria-label="{{ item.alt }}">No preview</span>
      {% endif %}
      {% if item.is_video %}
      <span class="badge video">Video{% if item.duration_label != "" %} · {{ item.duration_label }}{% endif %}</span>
      {% endif %}
      <figcaption>
        <span class="name">{{ item.name }}</span>
        <time>{{ item.captured_label }}</time>
      </figcaption>
    </a>
  </figure>
  {% endfor %}
</div>
