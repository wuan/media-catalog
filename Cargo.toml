[package]
name = "media-catalog"
version = "0.1.0"
edition = "2021"
description = "Generate a static, incremental catalog for a YYYY/MM media archive"
license = "MIT"

[dependencies]
anyhow = "1"
askama = "0.16"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
image = "0.25"
indicatif = "0.18"
percent-encoding = "2"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
walkdir = "2"
webp = "0.3"

[dev-dependencies]
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
