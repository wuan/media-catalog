[package]
name = "media-catalog"
version = "0.1.0"
edition = "2021"
description = "Generate a static, incremental catalog for a YYYY/MM media archive"
license = "MIT"

[dependencies]
anyhow = "1"
askama = "0.16"
async-stream = "0.3"
axum = "0.8"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
futures-core = "0.3"
httpdate = "1"
image = "0.25"
indicatif = "0.18"
mime_guess = "2"
percent-encoding = "2"
rayon = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "fs", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
toml = "1"
tower-http = { version = "0.6", features = ["catch-panic", "set-header"] }
walkdir = "2"
webp = "0.3"

[dev-dependencies]
insta = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
